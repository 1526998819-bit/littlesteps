<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LittleSteps 成长点滴</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
    body {
        background-color: #f8f9ff;
        background-image:
            radial-gradient(at 0% 0%, rgba(211, 229, 241, 0.4) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(255, 249, 229, 0.4) 0px, transparent 50%);
        min-height: 100vh;
        font-family: 'Be Vietnam Pro', sans-serif;
    }
    .font-display { font-family: 'Quicksand', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    @keyframes float { 0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)} }
    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-in { animation: fadeIn 0.8s ease forwards; }
    .squishy-btn:active { transform: scale(0.96); }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="animate-in text-center max-w-lg">
    <!-- Floating icon -->
    <div class="animate-float mb-8">
        <div class="inline-flex items-center justify-center w-28 h-28 rounded-full bg-primary-container shadow-2xl">
            <span class="material-symbols-outlined text-primary text-7xl" style="font-variation-settings:'FILL'1;">child_care</span>
        </div>
    </div>

    <h1 class="font-display text-6xl font-bold text-primary mb-4">LittleSteps</h1>
    <p class="text-2xl text-secondary mb-2">成长点滴</p>
    <p class="text-secondary/70 mb-10 text-lg leading-relaxed">记录宝宝的每一个珍贵时刻<br>陪伴孩子温柔成长</p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/dashboard.html" class="squishy-btn inline-flex items-center justify-center gap-2 px-8 py-4 bg-primary text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl transition-all">
            <span class="material-symbols-outlined">dashboard</span> 进入控制面板
        </a>
        <a href="/login.html" class="squishy-btn inline-flex items-center justify-center gap-2 px-8 py-4 bg-white text-primary font-bold text-lg rounded-2xl border-2 border-primary-container shadow-sm hover:shadow-md transition-all">
            <span class="material-symbols-outlined">login</span> 登录
        </a>
    </div>

    <footer class="mt-12 flex items-center justify-center gap-6">
      <span class="text-sm text-secondary/50">©cch（to the best one's ability）</span>
      <button onclick="showAbout()" class="text-sm text-secondary/40 hover:text-primary transition-colors underline underline-offset-4 cursor-pointer">关于我们</button>
    </footer>
    <!-- About Panel -->
    <div id="about-panel" class="fixed inset-0 z-50 flex items-center justify-center bg-black/25 backdrop-blur-sm hidden" onclick="if(event.target===this) hideAbout()">
      <div class="bg-white rounded-2xl shadow-xl p-8 max-w-xs w-full mx-4 text-center animate-in">
        <p class="text-2xl font-bold" style="color:#5a5243;">cch</p>
        <button onclick="hideAbout()" class="mt-5 text-sm text-secondary/50 hover:text-secondary underline underline-offset-4 transition-colors cursor-pointer">关闭</button>
      </div>
    </div>
</div>

<script>
// Auto-redirect if already logged in
(async function() {
    try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.success) {
            // Already logged in, show dashboard button prominently
            document.querySelector('a[href="/dashboard.html"]').classList.add('ring-4', 'ring-tertiary-fixed');
        }
    } catch(e) {}
})();

function showAbout() { document.getElementById('about-panel').classList.remove('hidden'); }
function hideAbout() { document.getElementById('about-panel').classList.add('hidden'); }
</script>
</body>
</html>
