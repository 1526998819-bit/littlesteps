<style>
        body {
            background-color: #f8f9ff;
            background-image:
                radial-gradient(at 0% 0%, rgba(211, 229, 241, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 249, 229, 0.3) 0px, transparent 50%);
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .squishy-button {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .squishy-button:active {
            transform: scale(0.92);
        }
        .moment-card:hover .moment-overlay {
            opacity: 1;
        }
        .growth-chart-bar {
            transition: height 1s ease-out;
        }
        @keyframes modalOverlayIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalContentIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateY(-100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes lightboxIn {
            from { opacity: 0; }
            to { opacity: 1; }

<body class="font-body-md text-on-background">
<!-- Toast -->
<div id="toast-top" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] pointer-events-none"></div>

<!-- Lightbox -->
<div id="lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 lightbox-overlay" style="display:none;" onclick="closeLightbox()">

</div>

<!-- Quick Add Modal -->

    <div class="modal-overlay absolute inset-0 bg-black/40" onclick="closeQuickAdd()"></div>
    <div class="modal-content relative bg-white rounded-xl p-8 max-w-lg w-full mx-4 shadow-2xl border-2 border-primary-container z-10">
        <h3 class="font-headline-md text-headline-md text-primary mb-6 flex items-center gap-2">
            <span class="material-symbols-outlined text-tertiary">add_circle</span> 新增记录
        </h3>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button class="p-6 bg-primary-container/40 hover:bg-primary-container/80 rounded-lg text-center squishy-button transition-all" onclick="quickAdd('每日日志')">
                <span class="material-symbols-outlined text-primary text-3xl mb-2 block">edit_note</span>
                <span class="font-label-md text-on-primary-container">每日日志</span>
            </button>
            <button class="p-6 bg-secondary-container/40 hover:bg-secondary-container/80 rounded-lg text-center squishy-button transition-all" onclick="quickAdd('成长轨迹')">
                <span class="material-symbols-outlined text-secondary text-3xl mb-2 block">monitor_weight</span>
                <span class="font-label-md text-on-secondary-container">成长轨迹</span>
            </button>
            <button class="p-6 bg-tertiary-container/40 hover:bg-tertiary-container/80 rounded-lg text-center squishy-button transition-all" onclick="quickAdd('疫苗计划')">

                <span class="font-label-md text-tertiary">疫苗计划</span>

<span class="material-symbols-outlined text-3xl">add_a_photo</span>

</div>
<div class="bg-tertiary-container/30 border-2 border-dashed border-tertiary-container/60 rounded-lg h-32 flex flex-col items-center justify-center text-tertiary hover:bg-tertiary-container/50 transition-all cursor-pointer squishy-button" onclick="triggerUpload('video')">

</button>

<script>
    // --- Auth ---
    async function handleLogout() {
        await AuthAPI.logout();
        window.location.href = '/login.html';
    }

    // --- Avatar Upload ---
    async function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        try {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/api/children/1/avatar', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success && data.data.avatarUrl) {
                document.getElementById('child-avatar').src = data.data.avatarUrl;
                document.getElementById('child-avatar').classList.remove('hidden');
                document.getElementById('child-avatar-icon').classList.add('hidden');
                showToast('✅ 头像更新成功！');
            } else {
                showToast('头像更新失败');
            }
        } catch (err) {
            showToast('头像更新失败，请重试');
        }
        e.target.value = '';
    }

    // --- Toast ---
    function showToast(msg) {
        const c = document.getElementById('toast-top');
        const el = document.createElement('div');
        el.className = 'toast-top bg-primary text-white px-6 py-3 rounded-lg shadow-lg font-label-md text-label-md mb-2 text-center';
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2000);
        setTimeout(() => el.remove(), 2500);
    }

    // --- Quick Add Modal ---
    function openQuickAdd() {
        document.getElementById('quick-add-modal').style.display = 'flex';
    }
    function closeQuickAdd() {
        document.getElementById('quick-add-modal').style.display = 'none';
    }
    function quickAdd(type) {
        closeQuickAdd();
        const targets = {
            '每日日志': 'journal.html',
            '成长轨迹': 'growth.html',
            '疫苗计划': 'vaccine.html',
            '精彩瞬间': 'gallery.html'
        };
        const url = targets[type];
        if (url) {
            showToast(`正在跳转到"${type}"… ✨`);
            setTimeout(() => { window.location.href = url; }, 400);
        }
    }

    // --- Lightbox ---
    function openLightbox(src, caption) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox-caption').textContent = caption;
        document.getElementById('lightbox').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = '';
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeLightbox(); closeQuickAdd(); }
    });

    // --- Vaccine Detail Toggle ---
    function toggleVaccineDetail() {
        const detail = document.getElementById('vaccine-detail');
        detail.classList.toggle('open');
    }

    // --- File Upload ---
    let uploadType = 'photo';
    function triggerUpload(type) {
        uploadType = type;
        document.getElementById('file-upload').click();
    }
    async function handleFileUpload(e) {
        const file = e.target.files[0];
        if (file) {
            try {
                await GalleryAPI.create({
                    childId: 1,
                    url: URL.createObjectURL(file),
                    caption: file.name,
                    type: uploadType === 'video' ? 'video' : 'photo',
                    takenAt: new Date().toISOString()
                });
                showToast(`✅ ${uploadType === 'photo' ? '照片' : '视频'} "${file.name}" 上传成功！`);
                loadDashboard();
            } catch(err) {
                showToast('上传失败，请重试');
            }
        }
        e.target.value = '';
    }

    // --- Growth Chart ---
    let growthCache = { heightData: [], weightData: [], months: [] };
    let currentMetric = 'height';

    function renderGrowthChart() {
        const container = document.getElementById('growth-chart-container');
        const data = currentMetric === 'height' ? growthCache.heightData : growthCache.weightData;
        const unit = currentMetric === 'height' ? 'cm' : 'kg';
        const label = currentMetric === 'height' ? '身高' : '体重';
        const color = currentMetric === 'height' ? 'bg-secondary' : 'bg-tertiary';
        const bgColor = currentMetric === 'height' ? 'bg-secondary-container/30' : 'bg-tertiary-container';

        if (data.length === 0) {
            container.innerHTML = '<div class="text-center w-full text-secondary text-sm py-8">暂无成长数据</div>';
            return;
        }

        const maxVal = Math.max(...data);
        container.innerHTML = data.map((val, i) => {
            const pct = (val / maxVal) * 100;
            const isLast = i === data.length - 1;
            return `
                <div class="flex flex-col items-center flex-1 gap-2 group">
                    <div class="w-full ${isLast ? bgColor : bgColor} rounded-t-lg relative flex items-end transition-all" style="height: ${40 + (pct * 0.55)}px;">
                        <div class="w-full ${isLast ? 'bg-tertiary' : color} rounded-t-lg growth-chart-bar" style="height:${pct}%;"></div>
                    </div>
                    <span class="text-[10px] font-bold ${isLast ? 'text-tertiary' : 'text-secondary'}">${growthCache.months[i]}<br>${val}${unit}</span>
                </div>`;
        }).join('');
        document.getElementById('growth-label').textContent = `最近${data.length}个月${label}变化`;

        setTimeout(() => {
            const bars = container.querySelectorAll('.growth-chart-bar');
            bars.forEach((bar, i) => {
                const h = bar.style.height;
                bar.style.height = '0';
                setTimeout(() => { bar.style.height = h; }, 50 + i * 80);
            });
        }, 50);
    }

    function switchGrowth(metric) {
        currentMetric = metric;
        document.getElementById('btn-height').className = metric === 'height'
            ? 'px-3 py-1 bg-secondary-container text-on-secondary-container rounded-lg text-xs font-bold squishy-button'
            : 'px-3 py-1 bg-surface-container text-secondary rounded-lg text-xs font-bold squishy-button hover:bg-secondary-container/50';
        document.getElementById('btn-weight').className = metric === 'weight'
            ? 'px-3 py-1 bg-tertiary-container text-tertiary rounded-lg text-xs font-bold squishy-button'
            : 'px-3 py-1 bg-surface-container text-secondary rounded-lg text-xs font-bold squishy-button hover:bg-secondary-container/50';
        renderGrowthChart();
    }

    // --- Load dashboard data ---
    async function loadDashboard() {
        try {
            const res = await DashboardAPI.get(1);
            if (!res.success || !res.data) return;
            const d = res.data;

            // Child info
            if (d.child) {
                document.getElementById('child-name').textContent = d.child.name;
                document.getElementById('child-info').innerHTML =
                    `👶 ${d.child.gender} · ${d.child.ageInMonths}个月 · ${d.child.birthDate}出生`;
                // Avatar
                if (d.child.avatarUrl) {
                    document.getElementById('child-avatar').src = d.child.avatarUrl;
                    document.getElementById('child-avatar').classList.remove('hidden');
                    document.getElementById('child-avatar-icon').classList.add('hidden');
                }
                // Milestones
                const badges = document.getElementById('milestone-badges');
                if (d.child.milestones && d.child.milestones.length > 0) {
                    badges.innerHTML = d.child.milestones.map((m, i) => {
                        const colors = ['bg-primary-container text-on-primary-container',
                            'bg-secondary-container text-on-secondary-container',
                            'bg-tertiary-container text-on-tertiary-container'];
                        return `<span class="px-3 py-1 ${colors[i % 3]} rounded-full text-xs font-bold">${m}</span>`;
                    }).join('');
                }
            }

            // Vaccine summary
            if (d.vaccines) {
                const vc = document.getElementById('vaccine-next-card');
                if (vc) {
                    const dateParts = d.vaccines.nextDate ? d.vaccines.nextDate.split('-') : ['--', '--'];
                    vc.innerHTML = `
                        <div class="flex-shrink-0 text-center px-4 py-2 bg-white rounded-lg shadow-sm">
                            <div class="text-tertiary font-bold text-xl">${dateParts[1] || '--'}月</div>
                            <div class="text-primary text-2xl font-bold">${dateParts[2] || '--'}</div>
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-bold text-primary text-lg">${d.vaccines.nextVaccine || '暂无'}</h3>
                            <p class="text-secondary text-sm">${d.vaccines.nextLocation || ''}${d.vaccines.nextDoctor ? ' · ' + d.vaccines.nextDoctor : ''}</p>
                        </div>
                        <button class="squishy-button px-4 py-2 bg-white text-primary border border-primary-fixed rounded-lg font-label-md text-label-md" onclick="toggleVaccineDetail()">详情</button>`;
                    // Update detail
                    const detailContent = document.getElementById('vaccine-detail-content');
                    if (detailContent && d.vaccines.nextLocation) {
                        detailContent.innerHTML = `
                            <p class="flex items-center gap-2"><span class="material-symbols-outlined text-tertiary text-sm">location_on</span> ${d.vaccines.nextLocation || ''}</p>
                            <p class="flex items-center gap-2"><span class="material-symbols-outlined text-tertiary text-sm">person</span> ${d.vaccines.nextDoctor || '待定'}</p>`;
                    }
                }
            }

            // Growth chart data
            if (d.recentGrowth && d.recentGrowth.length > 0) {
                growthCache.heightData = [];
                growthCache.weightData = [];
                growthCache.months = [];
                d.recentGrowth.forEach(g => {
                    growthCache.months.push(g.month);
                    if (g.label === '身高') {
                        growthCache.heightData.push(g.value);
                        growthCache.weightData.push(null);
                    } else {
                        growthCache.weightData.push(g.value);
                        growthCache.heightData.push(null);
                    }
                });
                for (let i = 0; i < growthCache.heightData.length; i++) {
                    if (growthCache.heightData[i] === null && i > 0) growthCache.heightData[i] = growthCache.heightData[i-1];
                    if (growthCache.weightData[i] === null && i > 0) growthCache.weightData[i] = growthCache.weightData[i-1];
                }
                growthCache.heightData = growthCache.heightData.filter(v => v !== null);
                growthCache.weightData = growthCache.weightData.filter(v => v !== null);
                renderGrowthChart();
            }

            // Gallery photos
            if (d.recentPhotos && d.recentPhotos.length > 0) {
                const container = document.getElementById('moments-container');
                const emptyEl = document.getElementById('moments-empty');
                if (emptyEl) emptyEl.remove();
                // Remove existing moment cards
                container.querySelectorAll('.moment-card').forEach(el => el.remove());
                const gridDiv = container.querySelector('.grid.grid-cols-2');

                d.recentPhotos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'moment-card group relative rounded-lg overflow-hidden h-40 cursor-pointer';
                    card.onclick = () => openLightbox(photo.url, photo.caption || '');
                    card.innerHTML = `
                        <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${photo.url}" alt="${photo.caption || ''}">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent p-4 flex flex-col justify-end moment-overlay opacity-0 transition-opacity">
                            <p class="text-white font-bold">${photo.caption || ''}</p>
                            <p class="text-white/80 text-xs">${photo.timeAgo || ''}</p>
                            </div>`;
                    container.insertBefore(card, gridDiv);
                });
            }
        } catch (err) {
            console.error('Dashboard load error:', err);
        }
    }

    // --- Init ---
    (async function() {
        const user = await checkAuth();
        if (!user) return;
        await loadDashboard();
    })();

    function showAbout() { document.getElementById('about-panel').classList.remove('hidden'); }
    function hideAbout() { document.getElementById('about-panel').classList.add('hidden'); }
</script>


</body></html>
