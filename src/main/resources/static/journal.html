<script>
    // --- Auth ---
    async function handleLogout() {
        await AuthAPI.logout();
        window.location.href = '/login.html';
    }

    // --- Entry storage ---
    let entries = [];
    let editingId = null;

    // --- Icon mapping ---
    const typeIcons = {
        'milestone': { icon: 'emoji_events', color: 'text-primary', bg: 'bg-primary-container/30' },
        'daily': { icon: 'edit_note', color: 'text-secondary', bg: 'bg-secondary-container/30' },
        'health': { icon: 'favorite', color: 'text-tertiary', bg: 'bg-tertiary-fixed/30' },
        '饮食': { icon: 'restaurant', color: 'text-primary', bg: 'bg-primary-container/30' },
        '睡眠': { icon: 'bedtime', color: 'text-secondary', bg: 'bg-secondary-container/30' },
        '换尿布': { icon: 'clean_hands', color: 'text-tertiary', bg: 'bg-tertiary-fixed/30' },
        '情绪': { icon: 'mood', color: 'text-on-surface-variant', bg: 'bg-surface-variant/40' },
        '其他': { icon: 'more_horiz', color: 'text-secondary', bg: 'bg-surface-container-low' }
    };

    // --- Toast ---
    function showToast(msg) {
        const container = document.getElementById('toast-top');
        const el = document.createElement('div');
        el.className = 'toast-top bg-primary text-white px-6 py-3 rounded-lg shadow-lg font-label-md text-label-md mb-2 text-center';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; });
        setTimeout(() => el.remove(), 600);
    }

    // --- Quick select ---
    function quickSelect(type, btn) {
        document.getElementById('entry-type').value = type;
        document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active-type'));
        btn.classList.add('active-type');
        document.getElementById('entry-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        showToast(`已选择：${type}`);
        const amountInput = document.getElementById('entry-amount');
        const placeholders = { '饮食': '例如: 180ml 母乳', '睡眠': '例如: 2小时15分钟', '换尿布': '例如: 湿尿布', '情绪': '例如: 开心 😊', '其他': '记录细节...' };
        amountInput.placeholder = placeholders[type] || '记录细节...';
        amountInput.focus();
    }

    function setCurrentTime() {
        document.getElementById('entry-time').value = new Date().toTimeString().slice(0, 5);
    }

    // --- Handle form submit ---
    async function handleFormSubmit(e) {
        e.preventDefault();
        const type = document.getElementById('entry-type').value;
        const time = document.getElementById('entry-time').value || new Date().toTimeString().slice(0, 5);
        const amount = document.getElementById('entry-amount').value.trim();
        const note = document.getElementById('entry-note').value.trim();

        if (!amount && !note) { showToast('请至少填写数量或备注 ✏️'); return; }

        const btn = document.getElementById('submit-btn');
        const origHTML = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 保存中...';
        btn.disabled = true;

        try {
            // Map quick-type to category
            const catMap = { '饮食': 'daily', '睡眠': 'daily', '换尿布': 'daily', '情绪': 'daily', '其他': 'daily' };
            await JournalAPI.create({
                childId: 1,
                entryDate: new Date().toISOString().split('T')[0],
                title: type + ' - ' + amount,
                content: note || amount,
                mood: type === '情绪' ? amount : null,
                category: catMap[type] || 'daily'
            });

            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> 已保存';
            btn.classList.add('bg-green-500');
            await loadEntries();
            resetForm();
        } catch (err) {
            showToast('保存失败，请重试');
        } finally {
            setTimeout(() => {
                btn.innerHTML = origHTML;
                btn.classList.remove('bg-green-500');
                btn.disabled = false;
            }, 1800);
        }
    }

    function resetForm() {
        document.getElementById('entry-type').value = '饮食';
        document.getElementById('entry-amount').value = '';
        document.getElementById('entry-note').value = '';
        setCurrentTime();
        editingId = null;
        document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active-type'));
    }

    // --- Load entries from API ---
    async function loadEntries() {
        try {
            const res = await JournalAPI.list(1);
            if (res.success && res.data) {
                entries = res.data.map(e => ({
                    id: e.id,
                    type: e.category === 'milestone' ? '里程碑' : (e.mood || '日常'),
                    time: e.entryDate || '',
                    amount: e.title || '',
                    note: e.content || ''
                }));
                renderFeed();
            }
        } catch (err) {
            console.error('Load entries error:', err);
        }
    }

    // --- Render feed ---
    function renderFeed() {
        const container = document.getElementById('feed-container');
        const clearBtn = document.getElementById('btn-clear-all');
        const badge = document.getElementById('entry-count-badge');

        if (entries.length === 0) {
            container.innerHTML = `<div id="empty-state" class="text-center py-10 bg-surface-container-lowest rounded-lg border-2 border-dashed border-outline-variant">
                <span class="material-symbols-outlined text-outline-variant text-4xl mb-2">history_toggle_off</span>
                <p class="font-body-md text-on-surface-variant">今日暂无记录</p>
                <p class="text-xs text-secondary/60 mt-1">点击上方快速记录按钮或填写右侧表单开始记录</p></div>`;
            clearBtn.style.display = 'none';
            badge.textContent = '0条记录';
            return;
        }

        clearBtn.style.display = 'block';
        badge.textContent = entries.length + '条记录';
        container.innerHTML = entries.map((entry, idx) => {
            const ti = typeIcons[entry.type] || typeIcons['其他'];
            return `<div class="entry-card bg-white p-6 rounded-lg shadow-sm border-2 border-surface-variant hover:border-primary-container/30 transition-all" style="animation-delay:${idx*0.05}s">
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full ${ti.bg} flex items-center justify-center">
                            <span class="material-symbols-outlined ${ti.color}">${ti.icon}</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-display text-label-md text-on-surface">${entry.type}</span>
                                <span class="text-xs text-secondary/60">${entry.time}</span>
                            </div>
                            ${entry.amount ? `<p class="font-body-md text-on-surface font-bold mt-1">${entry.amount}</p>` : ''}
                            ${entry.note ? `<p class="text-sm text-secondary mt-1">${entry.note}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button class="p-1.5 hover:bg-error-container/50 rounded-lg transition-all text-secondary hover:text-error" onclick="deleteEntry(${entry.id})" title="删除">
                            <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>
                </div></div>`;
        }).join('');
    }

    async function deleteEntry(id) {
        if (!confirm('确定删除该记录吗？')) return;
        try {
            await JournalAPI.delete(id);
            await loadEntries();
            showToast('记录已删除 🗑️');
        } catch (err) {
            showToast('删除失败');
        }
    }

    async function clearAllEntries() {
        if (entries.length === 0) return;
        if (!confirm(`确定要清空全部 ${entries.length} 条记录吗？`)) return;
        for (const e of entries) {
            try { await JournalAPI.delete(e.id); } catch (err) {}
        }
        await loadEntries();
        showToast('所有记录已清空');
    }

    // --- Bootstrap ---
    (async function() {
        const user = await checkAuth();
        if (!user) return;
        setCurrentTime();
        await loadEntries();
    })();

    function showAbout() { document.getElementById('about-panel').classList.remove('hidden'); }
    function hideAbout() { document.getElementById('about-panel').classList.add('hidden'); }
</script>


</body></html>
