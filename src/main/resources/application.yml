server:
  port: ${PORT:8080}

spring:
  application:
    name: littlesteps

  datasource:
    url: jdbc:h2:file:./data/littlesteps;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

# OSS 上传需要设置以下环境变量（不设置则上传功能不可用，其余功能正常）
# ALIYUN_OSS_ACCESS_KEY_ID=你的Key
# ALIYUN_OSS_ACCESS_KEY_SECRET=你的Secret
# ALIYUN_OSS_ENDPOINT=oss-cn-guangzhou.aliyuncs.com
# ALIYUN_OSS_BUCKET=littlesteps-images
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_OSS_BUCKET:}
